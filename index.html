<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ObsForce</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #18252b; background: #f6f8f8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(640px, 100%); }
    .eyebrow { color: #087078; font-size: .78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 14px 0; font-size: clamp(3rem, 8vw, 5rem); letter-spacing: -.055em; line-height: 1; }
    p { color: #4f626a; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Anonymous ICLR 2027 submission</p>
    <h1>ObsForce</h1>
    <p>Project page under preparation.</p>
  </main>
</body>
</html>
